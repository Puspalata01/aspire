version: '3.8'

services:
  ml-service:
    build: .
    container_name: aspire-ml-service
    ports:
      - "8000:8000"
      - "9090:9090"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
      - ./config:/app/config
    environment:
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=development
    restart: unless-stopped
    networks:
      - aspire-network

networks:
  aspire-network:
    driver: bridge
